<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>下一张，和你一起 · 照片墙预览</title>
  <link rel="stylesheet" href="wall.css">
</head>
<body>
  <main>
    <section class="memory-wall" aria-labelledby="wall-title">
      <header class="wall-heading">
        <p class="eyebrow">毛凌涛 <span>&</span> 陈婉梦</p>
        <h1 id="wall-title">下一张，和你一起。</h1>
        <p class="wall-message">把这次相聚，也留在照片里。</p>
      </header>
      <div class="board-surround">
        <div class="wall-board">
          <i class="corner corner-tl" aria-hidden="true"></i>
          <i class="corner corner-tr" aria-hidden="true"></i>
          <i class="corner corner-bl" aria-hidden="true"></i>
          <i class="corner corner-br" aria-hidden="true"></i>
          <div class="wall-stage" role="group" aria-label="十一张合照组成的秋日照片留言板">
            <div class="memory-string" aria-hidden="true"></div>
            <!-- WALL_PHOTOS -->
            <div class="board-doodles" aria-hidden="true">
              <img class="sticker star" src="pixel/Stardrop.png" alt="">
              <img class="sticker chicken" src="pixel/White_Chicken.png" alt="">
              <img class="sticker flower" src="pixel/Fairy_Rose.png" alt="">
              <span class="small-heart"></span>
              <span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
              <span class="leaf leaf-three"></span>
            </div>
          </div>
        </div>
        <div class="edge-decor" aria-hidden="true">
          <img class="autumn-tree" src="pixel/Oak_Fall.png" alt="">
          <img class="little-junimo" src="pixel/Junimo_Icon.png" alt="">
          <img class="little-pumpkin" src="pixel/Pumpkin.png" alt="">
          <img class="little-acorn" src="pixel/Acorn.png" alt="">
        </div>
      </div>
      <div class="wall-tail" aria-hidden="true"><span></span><i>♡</i><span></span></div>
    </section>
    <aside class="preview-note">照片墙第一版 · 仅本地预览，尚未替换线上请柬</aside>
  </main>
</body>
</html>
